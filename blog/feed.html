        <script src="../assets/terminal.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const videos = document.querySelectorAll('.feed-block video');
    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.play();
            } else {
                entry.target.pause();
            }
        });
    }, { threshold: 0.5 });

    videos.forEach(video => {
        observer.observe(video);
        
        video.addEventListener('click', () => {
            // mobile
            if (video.webkitEnterFullscreen) {
                video.muted = false;
                video.webkitEnterFullscreen();
                return;
            }

            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFullscreen) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        const onFullscreenChange = () => {
            const currentFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (currentFS === video) {
                video.muted = false;
            } else {
                video.muted = true;
            }
        };

        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);

        video.addEventListener('webkitendfullscreen', () => {
            video.muted = true;
        });
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const feedImages = document.querySelectorAll('.feed-block img');

    feedImages.forEach(img => {
        img.addEventListener('click', () => {
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt || '';
            lightbox.classList.add('active');
        });
    });

    lightbox.addEventListener('click', () => {
        lightbox.classList.remove('active');
    });
});
</script>
